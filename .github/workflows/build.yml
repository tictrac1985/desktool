name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, self-test, and package
        shell: powershell
        run: .\build.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-dist
          path: dist/
          retention-days: 14
